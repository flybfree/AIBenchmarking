# aibench run configuration
label: "bakeoff"
repeats: 3          # measured runs per (endpoint, task)
warmup: 1           # discarded warmup runs
timeout_s: 300
concurrency: 4      # >1 measures throughput under concurrent load
parallel_endpoints: true   # OK here: Prism and Area-51 are separate machines
# max_tokens: 512   # optional global cap (overrides per-task defaults)

tasks:
  - all             # creative_writing, code_generation, summarization, tool_use, agents

# Phase 3 LLM-judge: impartial external judge (OpenAI). Not one of the models
# under test, so no self-judging bias. Key comes from the OPENAI_API_KEY env var
# (never stored here). Note: this sends model outputs + task prompts to OpenAI.
judge:
  name: "judge"
  base_url: "https://api.openai.com/v1"
  model: "gpt-5.6-luna"
  api_key: "env:OPENAI_API_KEY"

endpoints:
  - name: "Prism"
    base_url: "http://192.168.3.89:1234/v1"     # LM Studio example
    model: "davidau/qwen3.8-27b-turbo-fable-cold-fusion-735-882-heretic-uncensored-neo-coder-max-mtp-gguf/qwen3.8-27b-turbofcfusion-735-882-here-uncen-neo-coder-max-mtp-q4_k_s.gguf"
    hardware: "RTX 5090"
    
  - name: "Area-51"
    base_url: "http://192.168.3.181:1234/v1"   # LM Studio 
    model: "huihui-gemma-4-e4b-it-qat-unquantized-abliterated"
    hardware: "RTX 4090"

  
